[package]
name = "infrastructure"
version = "0.1.0"
edition = "2024"

[dependencies]
application = { workspace = true }
domain = { workspace = true }

lib-schemas = { workspace = true, features = ["skuffen"] }
lib-nats = { workspace = true }
sikri_client = { workspace = true }

lib-sql = { workspace = true }
sqlx = { workspace = true, features = [
  "postgres",
  "runtime-tokio",
  "tls-rustls",
  "uuid",
  "chrono",
  "migrate",
] }

tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
futures = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
dotenvy = { workspace = true }
async-nats = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
reqwest = { workspace = true }
http = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }

# Feilhåndtering
anyhow = { workspace = true }
thiserror = { workspace = true }

# Tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
  "env-filter",
  "registry",
] }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true, features = ["trace", "metrics"] }
opentelemetry_sdk = { workspace = true, features = ["trace", "metrics"] }
opentelemetry-otlp = { workspace = true, features = [
  "grpc-tonic",
  "trace",
  "metrics",
] }
opentelemetry-http = { workspace = true }
tracing-stackdriver = { workspace = true }
tracing-log = { workspace = true }

uuid = { workspace = true, features = ["serde", "v7", "v5", "v4"] }

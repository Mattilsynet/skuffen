[package]
name = "infrastructure"
version = "0.1.0"
edition = "2024"

[dependencies]
application = { path = "../application" }
domain = { path = "../domain" }

lib-schemas = { git = "https://github.com/Mattilsynet/landdyrtilsyn-libs.git", package = "lib-schemas" }
lib-nats = { git = "https://github.com/Mattilsynet/landdyrtilsyn-libs.git", package = "lib-nats" }
sikri_client = {path = "../../crates/sikri_client"}

lib-sql = { git = "https://github.com/Mattilsynet/landdyrtilsyn-libs.git", package = "lib-sql", tag = "1.0.0" }
sqlx = { version = "0.8.6", default-features = false, features = [
  "postgres",
  "runtime-tokio-native-tls",
  "uuid",
  "chrono",
  "migrate",
] }

tokio = { version = "1.39", features = ["macros", "rt-multi-thread", "time"] }
futures = "0.3.31"
async-trait = "0.1.89"
axum = "0.8"
dotenvy = "0.15.7"
async-nats = "0.46"
bytes = "1.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12.23" }


# Feilhåndtering
anyhow = "1.0.99"
thiserror = "2.0.16"

# Tracing
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = [
  "env-filter",
  "registry",
] }
tracing-opentelemetry = "0.32.1"
opentelemetry = { version = "0.31.0", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.31.0", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.31.0", features = [
  "grpc-tonic",
  "trace",
  "metrics",
] }
opentelemetry-http = "0.31.0"
tracing-stackdriver = "0.10.0"
tracing-log = "0.2.0"

uuid = { version = "1.18.1", features = ["serde", "v7", "v4"] }

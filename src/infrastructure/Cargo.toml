[package]
name = "infrastructure"
version = "0.1.0"
edition = "2024"

[dependencies]
application = { path = "../application" }
domain = { path = "../domain" }

lib-schemas = { git = "https://github.com/Mattilsynet/landdyrtilsyn-libs.git", package = "lib-schemas", features = ["skuffen"] }
lib-nats = { git = "https://github.com/Mattilsynet/landdyrtilsyn-libs.git", package = "lib-nats" }
sikri_client = {path = "../../crates/sikri_client"}

lib-sql = { git = "https://github.com/Mattilsynet/landdyrtilsyn-libs.git", package = "lib-sql", tag = "1.5.5" }
sqlx = { version = "0.8.6", default-features = false, features = [
  "postgres",
  "runtime-tokio-native-tls",
  "uuid",
  "chrono",
  "migrate",
] }

tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "time"] }
futures = "0.3.32"
async-trait = "0.1.89"
axum = "0.8.9"
dotenvy = "0.15.7"
async-nats = "0.48.0"
bytes = "1.11.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
reqwest = { version = "0.13.3" }
http = "1.4.0"
base64 = "0.22.1"
url = "2.5.7"


# Feilhåndtering
anyhow = "1.0.102"
thiserror = "2.0.18"

# Tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
  "registry",
] }
tracing-opentelemetry = "0.32.1"
opentelemetry = { version = "0.31.0", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.31.0", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.32.0", features = [
  "grpc-tonic",
  "trace",
  "metrics",
] }
opentelemetry-http = "0.31.0"
tracing-stackdriver = "0.10.0"
tracing-log = "0.2.0"

uuid = { version = "1.23.1", features = ["serde", "v7", "v5", "v4"] }

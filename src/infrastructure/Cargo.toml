[package]
name = "infrastructure"
version = "0.1.0"
edition = "2021"

[dependencies]
application = { path = "../application" }
domain = { path = "../domain" }

lib-schemas = { git = "https://github.com/Mattilsynet/landdyrtilsyn-libs.git" }
sikri_client = {path = "../../crates/sikri_client"}



tokio = { version = "1.39", features = ["macros", "rt-multi-thread", "time"] }
futures = "0.3.31"
async-trait = "0.1.89"
axum = "0.8"
dotenvy = "0.15.7"
async-nats = "0.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


# Feilhåndtering
anyhow = "1.0.99"
thiserror = "2.0.16"

# Tracing
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = [
  "env-filter",
  "registry",
] }
tracing-opentelemetry = "0.32.0"
opentelemetry = { version = "0.31.0", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.31.0", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.31.0", features = [
  "grpc-tonic",
  "trace",
  "metrics",
] }
opentelemetry-http = "0.31.0"
tracing-stackdriver = "0.10.0"
tracing-log = "0.2.0"


[package]
name = "adr-fmt"
version = "0.1.0"
description = "ADR template and link-integrity validator"
edition = "2024"
rust-version = "1.91"
license = "MIT"
publish = false

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

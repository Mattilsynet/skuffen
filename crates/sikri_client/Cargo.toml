[package]
name = "sikri_client"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[test]]
name = "e2e_client"
path = "tests/e2e/e2e_client.rs"


[dependencies]
lib-schemas = { git = "https://github.com/Mattilsynet/landdyrtilsyn-libs.git" }
reqwest = {version = "0.13.2", features = ["json", "query"] }
serde = {version = "1.0.228", features = ["derive"]}
tokio = {version = "1.50.0", features = ["full"]}
chrono = { version = "0.4.44", features = ["serde"] }
anyhow = { version = "1.0.102" }
gcp_auth = { version = "0.12.6" }
base64 = "0.22.1"
serde_json = "1"
tracing = "0.1"

# CVC
aws-lc-sys = "0.38.0"
aws-lc-rs = "1.16.1"


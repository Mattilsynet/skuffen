[package]
name = "skuffen"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"

[workspace]
members = [
  ".",
  "src/domain",
  "src/application",
  "src/infrastructure",
  "crates/sikri_client",
  "crates/adr-fmt",
  "integration-tests"
]
resolver = "2"

[[bin]]
name = "skuffen"
path = "src/main.rs"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
enum_glob_use = "deny"

[workspace.dependencies]
anyhow = "1.0.103"
application = { path = "src/application" }
assert_cmd = "2"
async-nats = "0.49.1"
async-trait = "0.1.89"
aws-lc-rs = "1.17.0"
aws-lc-sys = "0.41.0"
axum = "0.8.9"
base64 = "0.22.1"
bytes = "1.12.0"
chrono = "0.4.45"
clap = "4"
domain = { path = "src/domain" }
dotenvy = "0.15.7"
futures = "0.3.32"
gcp_auth = "0.12.7"
http = "1.4.2"
infrastructure = { path = "src/infrastructure" }
lib-nats = { git = "https://github.com/Mattilsynet/landdyrtilsyn-libs.git", package = "lib-nats", tag = "1.6.0" }
lib-schemas = { git = "https://github.com/Mattilsynet/landdyrtilsyn-libs.git", package = "lib-schemas" }
lib-sql = { git = "https://github.com/Mattilsynet/landdyrtilsyn-libs.git", package = "lib-sql", tag = "1.6.0" }
opentelemetry = "0.32.0"
opentelemetry-http = "0.32.0"
opentelemetry-otlp = "0.32.0"
opentelemetry_sdk = "0.32.1"
predicates = "3"
regex = "1"
reqwest = "0.13.4"
rustls = "0.23.40"
serde = "1.0.228"
serde_json = "1.0.150"
sikri_client = { path = "crates/sikri_client" }
skuffen = { path = "." }
sqlx = { version = "0.9.0", default-features = false }
tempfile = "3"
testcontainers = "0.27.3"
testcontainers-modules = "0.15.0"
thiserror = "2.0.18"
tokio = "1.52.3"
toml = "1"
tracing = "0.1.44"
tracing-log = "0.2.0"
tracing-opentelemetry = "0.33.0"
tracing-stackdriver = "0.10.0"
tracing-subscriber = "0.3.23"
url = "2.5.8"
uuid = "1.23.4"

[dependencies]
anyhow = { workspace = true }
domain = { workspace = true }
application = { workspace = true }
infrastructure = { workspace = true }
lib-schemas = { workspace = true, features = ["skuffen"] }
lib-nats = { workspace = true }
dotenvy = { workspace = true }
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v5"] }

serde = { workspace = true, features = ["derive"] }
rustls = { workspace = true, features = ["aws_lc_rs"] }
thiserror = { workspace = true }

# CVC
aws-lc-sys = { workspace = true }
aws-lc-rs = { workspace = true }

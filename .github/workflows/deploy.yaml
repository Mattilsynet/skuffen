name: Deploy to Cloud Run

on:
  workflow_call:
    inputs:
      env:
        type: string
        description: Deployment environment
        required: true

jobs:
  version:
    name: Get version
    runs-on: ubuntu-latest
    outputs:
      shortsha: ${{ steps.shortsha.outputs.shortsha }}
    steps:
      - id: shortsha
        run: echo "shortsha=$(echo ${{ github.sha }} | cut -c 1-8)" >> $GITHUB_OUTPUT

  get-env:
    name: Get environment vaiables
    needs: [ version ]
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      project_number: ${{ steps.get-project-number.outputs.project_number }}
      project_id: ${{ steps.get-project-id.outputs.project_id }}
    steps:
      - name: Get project number
        id: get-project-number
        run: echo "project_number=${{ vars.PROJECT_NUMBER }}" >> $GITHUB_OUTPUT
      - name: Get project id
        id: get-project-id
        run: echo "project_id=${{ vars.PROJECT_ID }}" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [ version, get-env ]

    env:
      REPO_TOKEN: ${{ secrets.READ_SOURCE_AND_PACKAGES }}
      GAR_LOCATION: europe-north1
      ARTIFACT_ID: artifacts-352708
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: "auth-cr"
        name: "Authenticate to Google Cloud Run"
        uses: "google-github-actions/auth@v2"
        with:
          token_format: access_token
          create_credentials_file: true
          workload_identity_provider: projects/${{ needs.get-env.outputs.project_number }}/locations/global/workloadIdentityPools/gh-actions/providers/github
          service_account: cloudrun-wi-sa-github-actions@${{ needs.get-env.outputs.project_id }}.iam.gserviceaccount.com

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ needs.get-env.outputs.project_id }}
          region: ${{ env.GAR_LOCATION }}
          service: ${{ vars.SERVICE_NAME }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.ARTIFACT_ID }}/${{ vars.ARTIFACT_REPO_ID }}/${{ github.event.repository.name }}:latest
          suffix: ${{ needs.version.outputs.shortsha }}

      - name: Route traffic to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.SERVICE_NAME }}
          region: ${{ env.GAR_LOCATION }}
          revision_traffic: "${{ vars.SERVICE_NAME }}-${{ needs.version.outputs.shortsha }}=100"

name: Upload to Google artifact repository

on:
  workflow_call:
    inputs:
      ar_repo_id:
        description: The Google artifact repository id
        type: string
        required: true
      dockerfile:
        description: Path to docker image
        type: string
        required: false
        default: "./Dockerfile"
      application_name:
        description: Name of the Rust binary
        type: string
        required: false
        default: ${{ vars.APPLICATION_NAME }}
    secrets:
      READ_SOURCE_AND_PACKAGES:
        description: The token used to authenticate against packages repo
        required: true

jobs:
  upload:
    name: Upload

    runs-on: ubuntu-latest

    env:
      GAR_LOCATION: europe-north1
      ARTIFACT_ID: artifacts-352708

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - id: "auth-gar"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v2"
        with:
          token_format: access_token
          create_credentials_file: true
          workload_identity_provider: projects/799884623953/locations/global/workloadIdentityPools/gh-actions/providers/github
          service_account: artifacts-wi-sa-github-actions@${{ env.ARTIFACT_ID }}.iam.gserviceaccount.com

      - name: Login to GAR
        uses: "docker/login-action@v3"
        with:
          registry: "${{ env.GAR_LOCATION }}-docker.pkg.dev"
          username: "oauth2accesstoken"
          password: "${{ steps.auth-gar.outputs.access_token }}"

      - name: Build and push docker image to GAR
        uses: docker/build-push-action@v5
        with:
#          context: .
          file: ${{ inputs.dockerfile }}
          build-args: |
            REPO_TOKEN=${{ secrets.READ_SOURCE_AND_PACKAGES }}
            APPLICATION_NAME=${{ inputs.application_name }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.ARTIFACT_ID }}/${{ inputs.ar_repo_id }}/${{ github.event.repository.name }}:latest,${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.ARTIFACT_ID }}/${{ inputs.ar_repo_id }}/${{ github.event.repository.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

[package]
name = "skuffen-integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
skuffen = { path = ".." }
application = { path = "../src/application" }
infrastructure = { path = "../src/infrastructure" }
domain = { path = "../src/domain" }
lib-schemas = { git = "https://github.com/Mattilsynet/landdyrtilsyn-libs.git", features = ["skuffen"] }
lib-nats = { git = "https://github.com/Mattilsynet/landdyrtilsyn-libs.git", package = "lib-nats" }

anyhow = "1.0.102"
async-nats = "0.47.0"
bytes = "1.11.1"
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1.23.1", features = ["serde", "v4", "v7"] }
rustls = { version = "0.23.39", features = ["aws_lc_rs"] }
dotenvy = "0.15.7"

testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }

[dev-dependencies]
tracing = "0.1.44"

# CVC
aws-lc-sys = "0.40.0"
aws-lc-rs = "1.16.3"

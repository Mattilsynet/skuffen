
[package]
name = "app"
version = "0.1.0"
edition = "2021"

[dependencies]
# libs
read_worker = { path = "../read_worker" }
health_check = {path = "../health_check" }

tokio = { version = "1.39", features = ["macros", "rt-multi-thread", "time"] }

dotenvy = "0.15.7"
async-nats = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


# Feilhåndtering
anyhow = "1.0.99"
thiserror = "2.0.16"

# Tracing
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = [
  "env-filter",
  "registry",
] }
tracing-opentelemetry = "0.31.0"
opentelemetry = { version = "0.30.0", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.30.0", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.30.0", features = [
  "grpc-tonic",
  "trace",
  "metrics",
] }
opentelemetry-http = "0.30.0"
tracing-stackdriver = "0.10.0"
tracing-log = "0.2.0"

